apiVersion: v1
kind: ResourceQuota
metadata:
  name: dso202-quota
  namespace: dso202-assignment-01
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dso202-limits
  namespace: dso202-assignment-01
spec:
  limits:
    - type: Container
      default: { cpu: "250m", memory: "256Mi" }
      defaultRequest: { cpu: "100m", memory: "128Mi" }
      max: { cpu: "500m", memory: "512Mi" }
      min: { cpu: "50m", memory: "64Mi" }
